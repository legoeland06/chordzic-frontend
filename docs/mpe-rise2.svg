<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3a9b1"/><stop offset="1" stop-color="#6f757d"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52575e"/><stop offset="1" stop-color="#33373d"/>
    </linearGradient>
  </defs>

  <!-- Fond sombre (surface du module) -->
  <rect x="4" y="4" width="712" height="282" rx="14" fill="#0d1420" stroke="#3a4a63" stroke-width="1.5"/>

  <!-- 25 keywaves (2 octaves C3 → C5), style silicone mat -->
  <g>
    <!-- indices des touches « noires » : pitch % 12 ∈ {1,3,6,8,10} -->
    <rect x="10"  y="46" width="25" height="180" rx="10" fill="url(#w)"/>
    <rect x="38"  y="46" width="25" height="180" rx="10" fill="url(#b)"/>
    <rect x="66"  y="46" width="25" height="180" rx="10" fill="url(#w)"/>
    <rect x="94"  y="46" width="25" height="180" rx="10" fill="url(#b)"/>
    <rect x="122" y="46" width="25" height="180" rx="10" fill="url(#w)"/>
    <rect x="150" y="46" width="25" height="180" rx="10" fill="url(#w)"/>
    <rect x="178" y="46" width="25" height="180" rx="10" fill="url(#b)"/>
    <rect x="206" y="46" width="25" height="180" rx="10" fill="url(#w)"/>
    <rect x="234" y="46" width="25" height="180" rx="10" fill="url(#b)"/>
    <rect x="262" y="46" width="25" height="180" rx="10" fill="url(#w)"/>
    <rect x="290" y="46" width="25" height="180" rx="10" fill="url(#b)"/>
    <rect x="318" y="46" width="25" height="180" rx="10" fill="url(#w)"/>
    <rect x="346" y="46" width="25" height="180" rx="10" fill="url(#w)"/>
    <rect x="374" y="46" width="25" height="180" rx="10" fill="url(#b)"/>
    <rect x="402" y="46" width="25" height="180" rx="10" fill="url(#w)"/>
    <rect x="430" y="46" width="25" height="180" rx="10" fill="url(#b)"/>
    <rect x="458" y="46" width="25" height="180" rx="10" fill="url(#w)"/>
    <rect x="486" y="46" width="25" height="180" rx="10" fill="url(#w)"/>
    <rect x="514" y="46" width="25" height="180" rx="10" fill="url(#b)"/>
    <rect x="542" y="46" width="25" height="180" rx="10" fill="url(#w)"/>
    <rect x="570" y="46" width="25" height="180" rx="10" fill="url(#b)"/>
    <rect x="598" y="46" width="25" height="180" rx="10" fill="url(#w)"/>
    <rect x="626" y="46" width="25" height="180" rx="10" fill="url(#b)"/>
    <rect x="654" y="46" width="25" height="180" rx="10" fill="url(#w)"/>
    <rect x="682" y="46" width="25" height="180" rx="10" fill="url(#w)"/>
  </g>

  <!-- Repères des notes C -->
  <circle cx="22.5" cy="58" r="3" fill="#67e8f9"/>
  <circle cx="358.5" cy="58" r="3" fill="#67e8f9"/>
  <circle cx="694.5" cy="58" r="3" fill="#67e8f9"/>

  <!-- Flèche du BEND (translation verticale du poignet) -->
  <g stroke="#22d3ee" stroke-width="3" fill="none" opacity="0.95">
    <path d="M 470 60 L 470 214 M 462 74 L 470 60 L 478 74 M 462 200 L 470 214 L 478 200"/>
  </g>
  <text x="492" y="112" fill="#22d3ee" font-size="13" font-weight="700">▲</text>
  <text x="492" y="132" fill="#22d3ee" font-size="13" font-weight="700">Bend</text>
  <text x="492" y="150" fill="#67e8f9" font-size="11">aigu</text>
  <text x="492" y="176" fill="#22d3ee" font-size="13" font-weight="700">▼</text>
  <text x="492" y="196" fill="#67e8f9" font-size="11">grave</text>

  <!-- Flèches du VIBRATO (glissé horizontal, petite amplitude) -->
  <g stroke="#f472b6" stroke-width="2.5" fill="none" opacity="0.95">
    <path d="M 190 120 L 226 120 M 194 113 L 190 120 L 194 127 M 222 113 L 226 120 L 222 127"/>
    <path d="M 190 140 L 226 140 M 194 133 L 190 140 L 194 147 M 222 133 L 226 140 L 222 147"/>
  </g>
  <text x="160" y="134" fill="#f472b6" font-size="11" font-weight="700">Vibrato</text>

  <!-- Légende -->
  <text x="360" y="260" text-anchor="middle" fill="#9ca3af" font-size="12">
    25 keywaves · C3 → C5 · 2 octaves — pose = accord juste · translation du poignet = bend · glissando en traversant
  </text>
  <text x="360" y="278" text-anchor="middle" fill="#6b7280" font-size="10.5">
    multi-touch : chaque doigt tient sa note · le dernier doigt bougé pilote bend/vibrato
  </text>
</svg>
