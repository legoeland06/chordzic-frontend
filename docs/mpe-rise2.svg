    <rect x="290" y="46" width="25" height="180" rx="9" fill="url(#w)"/>
    <rect x="318" y="46" width="25" height="180" rx="9" fill="url(#w)"/>
    <rect x="346" y="46" width="25" height="180" rx="9" fill="url(#w)"/>
    <rect x="374" y="46" width="25" height="180" rx="9" fill="url(#w)"/>
    <rect x="402" y="46" width="25" height="180" rx="9" fill="url(#w)"/>
    <rect x="430" y="46" width="25" height="180" rx="9" fill="url(#w)"/>
    <rect x="458" y="46" width="25" height="180" rx="9" fill="url(#w)"/>
    <rect x="486" y="46" width="25" height="180" rx="9" fill="url(#w)"/>
    <rect x="514" y="46" width="25" height="180" rx="9" fill="url(#w)"/>
    <rect x="542" y="46" width="25" height="180" rx="9" fill="url(#w)"/>
