    <rect x="374" y="46" width="25" height="12" rx="9"/>
    <rect x="402" y="46" width="25" height="12" rx="9"/>
    <rect x="430" y="46" width="25" height="12" rx="9"/>
    <rect x="458" y="46" width="25" height="12" rx="9"/>
    <rect x="486" y="46" width="25" height="12" rx="9"/>
    <rect x="514" y="46" width="25" height="12" rx="9"/>
    <rect x="542" y="46" width="25" height="12" rx="9"/>
    <rect x="570" y="46" width="25" height="12" rx="9"/>
    <rect x="598" y="46" width="25" height="12" rx="9"/>
    <rect x="626" y="46" width="25" height="12" rx="9"/>
    <rect x="654" y="46" width="25" height="12" rx="9"/>
    <rect x="682" y="46" width="25" height="12" rx="9"/>
