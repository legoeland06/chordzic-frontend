<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e444d"/><stop offset="1" stop-color="#272c34"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3038"/><stop offset="1" stop-color="#181c22"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Fond sombre (surface du module) -->
  <rect x="4" y="4" width="712" height="282" rx="14" fill="#0d1420" stroke="#3a4a63" stroke-width="1.5"/>

  <!-- 25 keywaves (2 octaves C3 → C5) : blanches pleine hauteur -->
  <g>
    <rect x="10"  y="46" width="25" height="180" rx="9" fill="url(#w)"/>
    <rect x="38"  y="46" width="25" height="180" rx="9" fill="url(#w)"/>
