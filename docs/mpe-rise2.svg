    <rect x="654" y="46" width="25" height="180" rx="9" fill="url(#w)"/>
    <rect x="682" y="46" width="25" height="180" rx="9" fill="url(#w)"/>
  </g>

  <!-- Touches noires : plus courtes (58 %), posées devant, ombre portée -->
  <g filter="url(#sh)">
    <rect x="38"  y="46" width="25" height="104" rx="8" fill="url(#b)"/>
    <rect x="94"  y="46" width="25" height="104" rx="8" fill="url(#b)"/>
    <rect x="178" y="46" width="25" height="104" rx="8" fill="url(#b)"/>
    <rect x="234" y="46" width="25" height="104" rx="8" fill="url(#b)"/>
    <rect x="290" y="46" width="25" height="104" rx="8" fill="url(#b)"/>
