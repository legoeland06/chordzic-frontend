<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1420"/><stop offset="0.5" stop-color="#16202f"/><stop offset="1" stop-color="#0d1420"/>
    </linearGradient>
  </defs>

  <!-- Fond sombre (le strip) -->
  <rect x="4" y="4" width="712" height="282" rx="14" fill="#0d1420" stroke="#3a4a63" stroke-width="1.5"/>
  <rect x="24" y="30" width="672" height="210" rx="12" fill="url(#bg)" stroke="#24324a" stroke-width="1"/>

  <!-- Repères croisés -->
  <line x1="360" y1="30" x2="360" y2="240" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.55"/>
  <line x1="24" y1="135" x2="696" y2="135" stroke="#64748b" stroke-width="1" stroke-dasharray="4 5" opacity="0.5"/>

  <!-- Axe X : Bend -->
  <g stroke="#22d3ee" stroke-width="3" fill="none">
    <path d="M 60 160 L 250 160 M 64 150 L 60 160 L 64 170 M 246 150 L 250 160 L 246 170"/>
    <path d="M 470 160 L 660 160 M 474 150 L 470 160 L 474 170 M 656 150 L 660 160 L 656 170"/>
  </g>
  <text x="80" y="150" fill="#22d3ee" font-size="12" font-weight="700">◀ Bend grave</text>
  <text x="480" y="150" fill="#22d3ee" font-size="12" font-weight="700">Bend aigu ▶</text>

  <!-- Axe Y : Timbre -->
  <g stroke="#a78bfa" stroke-width="3" fill="none">
    <path d="M 280 40 L 280 120 M 272 44 L 280 40 L 288 44 M 272 116 L 280 120 L 288 116"/>
    <path d="M 280 150 L 280 230 M 272 154 L 280 150 L 288 154 M 272 226 L 280 230 L 288 226"/>
  </g>
  <text x="292" y="66" fill="#a78bfa" font-size="12" font-weight="700">▲ Timbre brillant</text>
  <text x="292" y="205" fill="#a78bfa" font-size="12" font-weight="700">▼ Timbre sombre</text>

  <!-- Curseur -->
  <circle cx="360" cy="135" r="16" fill="rgba(34,211,238,0.30)" stroke="#22d3ee" stroke-width="2.5"/>

  <!-- Légendes -->
  <text x="360" y="262" text-anchor="middle" fill="#9ca3af" font-size="12">
    Bande tactile plein écran — X = pitch bend (range ±2..±48) · Y = timbre CC74 · molette = pression (aftertouch)
  </text>
  <text x="360" y="280" text-anchor="middle" fill="#6b7280" font-size="10.5">
    retour auto au centre au relâchement (ou maintien) · gestes échantillonnés ~60 Hz
  </text>
</svg>
