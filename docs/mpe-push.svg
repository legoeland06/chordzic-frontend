<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="p0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#db2777"/><stop offset="1" stop-color="#831843"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ea580c"/><stop offset="1" stop-color="#7c2d12"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#14532d"/></linearGradient>
    <linearGradient id="p4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#164e63"/></linearGradient>
    <linearGradient id="p5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="p6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ca8a04"/><stop offset="1" stop-color="#713f12"/></linearGradient>
    <linearGradient id="p7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e11d48"/><stop offset="1" stop-color="#881337"/></linearGradient>
  </defs>

  <!-- Fond sombre -->
  <rect x="4" y="4" width="712" height="322" rx="14" fill="#0d1420" stroke="#3a4a63" stroke-width="1.5"/>

  <!-- Grille 8×8 de pads (64) -->
  <g>
    <!-- 8 colonnes × 8 lignes, pad 74 px, gap 6 -->
    <rect x="52"  y="40"  width="74" height="74" rx="10" fill="url(#p0)"/>
    <rect x="132" y="40"  width="74" height="74" rx="10" fill="url(#p1)"/>
    <rect x="212" y="40"  width="74" height="74" rx="10" fill="url(#p2)"/>
    <rect x="292" y="40"  width="74" height="74" rx="10" fill="url(#p3)"/>
    <rect x="372" y="40"  width="74" height="74" rx="10" fill="url(#p4)"/>
    <rect x="452" y="40"  width="74" height="74" rx="10" fill="url(#p5)"/>
    <rect x="532" y="40"  width="74" height="74" rx="10" fill="url(#p6)"/>
    <rect x="612" y="40"  width="74" height="74" rx="10" fill="url(#p7)"/>
    <rect x="52"  y="120" width="74" height="74" rx="10" fill="url(#p7)"/>
    <rect x="132" y="120" width="74" height="74" rx="10" fill="url(#p0)"/>
    <rect x="212" y="120" width="74" height="74" rx="10" fill="url(#p1)"/>
    <rect x="292" y="120" width="74" height="74" rx="10" fill="url(#p2)"/>
    <rect x="372" y="120" width="74" height="74" rx="10" fill="url(#p3)"/>
    <rect x="452" y="120" width="74" height="74" rx="10" fill="url(#p4)"/>
    <rect x="532" y="120" width="74" height="74" rx="10" fill="url(#p5)"/>
    <rect x="612" y="120" width="74" height="74" rx="10" fill="url(#p6)"/>
    <rect x="52"  y="200" width="74" height="74" rx="10" fill="url(#p6)"/>
    <rect x="132" y="200" width="74" height="74" rx="10" fill="url(#p7)"/>
    <rect x="212" y="200" width="74" height="74" rx="10" fill="url(#p0)"/>
    <rect x="292" y="200" width="74" height="74" rx="10" fill="url(#p1)"/>
    <rect x="372" y="200" width="74" height="74" rx="10" fill="url(#p2)"/>
    <rect x="452" y="200" width="74" height="74" rx="10" fill="url(#p3)"/>
    <rect x="532" y="200" width="74" height="74" rx="10" fill="url(#p4)"/>
    <rect x="612" y="200" width="74" height="74" rx="10" fill="url(#p5)"/>
  </g>

  <!-- Pad actif -->
  <rect x="292" y="120" width="74" height="74" rx="10" fill="none" stroke="#22d3ee" stroke-width="3"/>

  <!-- Légende -->
  <text x="360" y="308" text-anchor="middle" fill="#9ca3af" font-size="12">
    64 pads (8×8) échantillonnés — import wav/mp3/ogg/flac/m4a/aiff · retrigger immédiat · couleurs par dégradés
  </text>
